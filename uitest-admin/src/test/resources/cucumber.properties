# Read by the Cucumber CLI runtime (io.cucumber.core.cli.Main), which IntelliJ's "Cucumber for
# Java" plugin uses for feature-file right-clicks — it reads this file, not
# junit-platform.properties. Extent reporting comes from the @Before/@BeforeStep/@After hooks
# on the glue path below; the plugin only adds each Gherkin step's text to the report.
cucumber.glue=io.mosip.testrig.adminui.steps,io.mosip.testrig.adminui.hooks
cucumber.plugin=io.mosip.testrig.adminui.report.GherkinStepReporter
cucumber.publish.quiet=true
