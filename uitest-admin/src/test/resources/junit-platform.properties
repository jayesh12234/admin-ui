cucumber.publish.quiet=true
cucumber.glue=io.mosip.testrig.adminui.steps,io.mosip.testrig.adminui.hooks
cucumber.plugin=io.mosip.testrig.adminui.report.GherkinStepReporter

# Every scenario launches its own browser; override with
# -Dcucumber.execution.parallel.config.fixed.parallelism=<n>
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4

# Create forms pick the first type/spec in their dropdowns, which can be the record a parallel
# type/spec scenario just created and deactivated — creating against it fails. Scenarios that
# create those records and scenarios that consume them never run at the same time.
cucumber.execution.exclusive-resources.centerTypeCRUD.read-write=CENTER_TYPES
cucumber.execution.exclusive-resources.centerCRUD.read-write=CENTER_TYPES
cucumber.execution.exclusive-resources.deviceTypesCRUD.read-write=DEVICE_TYPES
cucumber.execution.exclusive-resources.deviceSpecCRUD.read-write=DEVICE_TYPES,DEVICE_SPECS
cucumber.execution.exclusive-resources.deviceCRUD.read-write=DEVICE_SPECS
cucumber.execution.exclusive-resources.machineTypesCRUD.read-write=MACHINE_TYPES
cucumber.execution.exclusive-resources.machineSpecCRUD.read-write=MACHINE_TYPES,MACHINE_SPECS
cucumber.execution.exclusive-resources.machineCRUD.read-write=MACHINE_SPECS
cucumber.execution.exclusive-resources.bulkUploadCRUD.read-write=DEVICE_TYPES
