# ─── Admin Portal UI Automation Configuration ────────────────────────────────
# Tracked with blank/default values only — fill in env-specific URLs and the
# *_client_secret keys below for your own local run, but never commit real values back here.
#
# Priority (lowest → highest):
#   Kernel.properties  (apitest-commons JAR)
#   uitest.properties  (uitest-commons JAR)
#   this file
#   environment variables / Rancher overrides
#
# Only declare keys here that are:
#   (a) not present in Kernel / uitest at all, OR
#   (b) present but EMPTY in Kernel / uitest (we supply the value), OR
#   (c) intentionally overriding a non-empty default

# ─── Module identity ──────────────────────────────────────────────────────────
moduleName=admin-ui

# ─── Environment URLs ─────────────────────────────────────────────────────────
# Admin Portal URL, e.g. https://admin.dev.mosip.net/ (the legacy adminPortalPath key/env var
# is still honoured when this is blank). A localhost URL switches on local-portal mode — see README.
baseUrl=
apiInternalEndPoint=

# Override Kernel default (Kernel has a different env hardcoded)
keycloak-external-url=

# Optional: base URL of a locally running kernel-masterdata-service (e.g. http://localhost:8086).
# Blank = masterdata API calls go to apiInternalEndPoint.
masterdatabaseurl=

# ─── Admin-specific API path fragments ────────────────────────────────────────
# (zoneMappingUrl, zoneMappingActivateUrl already in Kernel.properties)
appVersionEndpoint=/v1/masterdata/actuator/info
leafzonesURL=/v1/masterdata/zones/leafzones/
locationHierarchyLevels=/v1/masterdata/locationHierarchyLevels/

# ─── Keycloak / IAM ───────────────────────────────────────────────────────────
# keycloak-realm-id, admin_password already in Kernel with correct values

# Override Kernel (Kernel has a hardcoded list of user IDs; we create one module-prefixed user)
iam-users-to-create=auto

# Override: Kernel uses 220005; the portal logs in as the module-prefixed auto user
admin_userName=auto
roles.auto=GLOBAL_ADMIN,ID_AUTHENTICATION,PARTNER_ADMIN,PMS_ADMIN,POLICYMANAGER,REGISTRATION_ADMIN,REGISTRATION_SUPERVISOR,ZONAL_ADMIN

# ─── Client secrets ───────────────────────────────────────────────────────────
# client_ids already in Kernel with correct values
# Kernel has all secrets empty — fill these in locally; NEVER commit real values here.
mosip_admin_client_secret=
mosip_testrig_client_secret=

# ─── Browser & execution ──────────────────────────────────────────────────────
# browser defaults in uitest.properties
headless=yes

# Keycloak login page language: eng, fra, ara, hin, tam, kan (sin = English). Also picks the
# BulkUploadFiles/<loginlang>/ folder.
loginlang=eng

# ─── Report & S3 ──────────────────────────────────────────────────────────────
# push-reports-to-s3, s3-host, s3-account, s3-region, reportExpirationInDays,
# s3-user-key already in Kernel/uitest with correct values

# Override uitest default (uitest has "MOSIP UI Automation")
reportName=Admin Portal UI Automation

# Override uitest default (target/extent-reports/) — keep report output out of the
# Maven-managed, mvn-clean-wiped target/ tree, at the module root instead.
reportOutputDir=test-output/

# Report evidence, embedded in the report HTML so the single file can be shared as is.
# Screen recording per scenario: always | onFailure | off (each recording adds a few MB)
recordVideo=onFailure
# Screenshot before every element interaction, with the element outlined: yes | no
screenshotEveryAction=yes
# Playwright trace (DOM snapshots, network, console per action) for failed scenarios: yes | no
traceOnFailure=yes

# Kernel has s3-user-secret empty — this is the well-known default MinIO admin credential,
# fine for local/dev MinIO; override for anything else.
s3-user-secret=minioadmin

# ─── Master DB cleanup ────────────────────────────────────────────────────────
# yes (default) = after the run, delete the master-data rows this run's user created
# (cr_by = <run user>). Skipped with a warning while postgres-password is blank.
# db-port, db-su-user, master_db_schema already in Kernel.
cleanupMasterData=yes
# Override Kernel default (Kernel has a different env hardcoded)
db-server=
postgres-password=

# ─── Test data ────────────────────────────────────────────────────────────────

# Run only specific scenarios, by exact name (case-insensitive, comma-separated) — leave
# blank to run everything. e.g. scenarioToRun=Center type CRUD,Device type CRUD
scenarioToRun=

# Prefix of the generated ${data} value (prefix + yyyyMMddHHmm), used for codes and names.
preappend=00

# How long (seconds) to keep refreshing a bulk upload transaction before expecting COMPLETED.
bulkUploadStatusWaitSeconds=60
